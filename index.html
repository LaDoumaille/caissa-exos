<style>

.pod .av{width:52px;height:52px;font-size:18px;margin:0 auto 6px}

.lb .who2{flex:1;min-width:0}
.lb .who2 .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--green)}.dots i.ko{background:var(--red)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}

<script type="module">
// ================= Réglages =================
const SUPABASE_URL = 'https://gccyhuqhgnfoqbbmddio.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AToTLFhUYhWZsUlmM9D6jw_Oz26dg1r';
const MAX_VIDEO = 50 * 1024 * 1024;   // limite du stockage gratuit par fichier
const MAX_REC_SECONDS = 300;          // 5 minutes d'enregistrement maximum

import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.2.1/+esm';
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

// ================= Accès aux données =================
async function makeApi() {
  if (window.__API_MOCK__) return window.__API_MOCK__;
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm');
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    members: async () => ok(await sb.from('members').select('id,name,created_at').order('name')),
    exercises: async () => ok(await sb.from('exercises').select('*').order('num', { ascending: false })),
    answers: async () => ok(await sb.from('answers').select('exercise_id,member_id,choice,created_at')),
    addMember: async (name) => ok(await sb.from('members').insert({ name }).select('id,name,created_at').single()),
    answer: async (exercise_id, member_id, choice) => ok(await sb.from('answers').insert({ exercise_id, member_id, choice })),
    coachOk: async (key) => ok(await sb.rpc('coach_ok', { p_key: key })),
    createExercise: async (key, e) => ok(await sb.rpc('create_exercise', { p_key: key, p_num: e.num, p_fen: e.fen, p_question: e.question, p_options: e.options, p_correct: e.correct })),
    solution: async (key, id) => ok(await sb.rpc('coach_solution', { p_key: key, p_exercise: id })),
    reveal: async (key, id, video_url, comment) => ok(await sb.rpc('reveal_exercise', { p_key: key, p_exercise: id, p_video_url: video_url, p_comment: comment })),
    deleteExercise: async (key, id) => ok(await sb.rpc('delete_exercise', { p_key: key, p_exercise: id })),
    deleteMember: async (key, id) => ok(await sb.rpc('delete_member', { p_key: key, p_member: id })),
    uploadVideo: async (blob, name) => {
      const type = (blob.type || 'video/mp4').split(';')[0];
      ok(await sb.storage.from('videos').upload(name, blob, { contentType: type, upsert: false }));
      return sb.storage.from('videos').getPublicUrl(name).data.publicUrl;
    },
  };
}

// ================= Petits outils =================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('caissa.' + k)); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('caissa.' + k) : localStorage.setItem('caissa.' + k, JSON.stringify(v)); } catch {} },
};
const FR = { N: 'C', B: 'F', R: 'T', Q: 'D', K: 'R' };
const frSan = (san) => san.replace(/[NBRQK]/g, c => FR[c]);
const turnOf = (fen) => (fen.split(' ')[1] === 'b' ? 'black' : 'white');
function moveLabel(fen, san) {
  const parts = fen.split(' ');
  const n = parseInt(parts[5] || '1', 10) || 1;
  return `${n}${parts[1] === 'b' ? '...' : '.'}${frSan(san)}`;
}
const initials = (n) => n.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4200 : 2400);
}
function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e);
  if (/not_coach/.test(m)) return "Mode coach expiré : reconnecte-toi avec le mot de passe.";
  if (/answers_exercise_id_member_id_key|duplicate key.*answers/.test(m)) return 'Tu as déjà répondu à cet exo.';
  if (/members_name_uniq/.test(m)) return 'Ce prénom existe déjà : choisis-le dans la liste.';
  if (/row-level security.*answers/.test(m)) return 'Trop tard : la correction est publiée.';
  if (/exercises_num_key/.test(m)) return 'Ce numéro d’exo existe déjà.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion. Réessaie dans un instant.';
  return m;
}

// ================= Classement =================
function scores() {
  const revealed = S.exercises.filter(e => e.status === 'revealed').sort((a, b) => a.num - b.num);
  const byEx = new Map(revealed.map(e => [e.id, e]));
  const by = {};
  for (const a of S.answers) {
    const e = byEx.get(a.exercise_id); if (!e) continue;
    const r = by[a.member_id] ||= { id: a.member_id, pts: 0, played: 0, res: {} };
    const ok = (e.correct || []).includes(a.choice);
    r.played++; if (ok) r.pts++; r.res[e.id] = ok;
  }
  const rows = Object.values(by).filter(r => S.members.some(m => m.id === r.id))
    .sort((x, y) => y.pts - x.pts || x.played - y.played || memberName(x.id).localeCompare(memberName(y.id), 'fr'));
  let rank = 0, prev = null;
  rows.forEach((r, i) => { const key = r.pts + '/' + r.played; if (key !== prev) { rank = i + 1; prev = key; } r.rank = rank; });
  return { rows, revealed };
}
function myScore() {
  const { rows } = scores(); const r = rows.find(x => x.id === S.meId);
  return { pts: r ? r.pts : 0, rank: r ? r.rank : 0, n: rows.length };
}
function viewBoardTable() {
  const { rows, revealed } = scores();

  let html = tabs('lb') + `<h1>Classement</h1><p class="sub">1 point par bonne réponse · ${total} challenge${total > 1 ? 's' : ''} corrigé${total > 1 ? 's' : ''} · <span class="live">en direct</span></p>`;
  if (!rows.length) {
    html += `<div class="empty">Le classement s'affiche dès la première correction publiée.</div>`;
  } else {
    const top = rows.slice(0, 3);
    const pod = (r, p) => r ? `<div class="pod p${p}"><div class="md">${r.pts > 0 ? (['🥇', '🥈', '🥉'][r.rank - 1] || '') : ''}</div><div class="av ${r.id === S.meId ? 'me' : ''}">${esc(initials(memberName(r.id)))}</div><div class="nm">${esc(memberName(r.id))}</div><div class="step">${r.pts}<small>pt${r.pts > 1 ? 's' : ''} · ${r.played} joué${r.played > 1 ? 's' : ''}</small></div></div>` : '<div></div>';
    html += `<div class="podium">${pod(top[1], 2)}${pod(top[0], 1)}${pod(top[2], 3)}</div>`;
    html += `<ul class="lb">` + rows.map(r => {
      const dots = last.map(e => `<i class="${r.res[e.id] === true ? 'ok' : r.res[e.id] === false ? 'ko' : ''}" title="Challenge ${e.num}"></i>`).join('');
      const pct = Math.round(r.pts * 100 / r.played);
      return `<li class="${r.id === S.meId ? 'me' : ''}"><span class="rk">${r.rank}</span><span class="av ${r.id === S.meId ? 'me' : ''}">${esc(initials(memberName(r.id)))}</span><span class="who2"><span class="nm">${esc(memberName(r.id))}</span><span class="dots">${dots}</span></span><span class="pts">${r.pts}<small>${pct} % réussite</small></span></li>`;
    }).join('') + `</ul>`;
    if (S.meId && !rows.some(r => r.id === S.meId)) html += `<div class="note">Tu n'es pas encore classé : réponds au prochain challenge !</div>`;
    else if (!S.meId && !S.coach) html += `<div class="note gold">Crée ton profil pour entrer au classement.<div style="height:10px"></div><button class="btn gold" id="mkprofile">Créer mon profil</button></div>`;
    html += `<p class="sub" style="font-size:13px;margin-top:12px">Pastilles : ${last.length > 1 ? `les ${last.length} derniers challenges corrigés` : 'le dernier challenge corrigé'} (vert trouvé, rouge raté, gris pas joué).</p>`;
  }
  $('#app').innerHTML = html;
  const mk = $('#mkprofile'); if (mk) mk.onclick = () => pickIdentity();

  const correct = revealed ? (ex.correct || []) : (coach ? await loadSolution(ex) : []);

        ${isMine ? '<span class="meta">ta réponse</span>' : ''}
        ${showStats ? `<div class="bar"><b style="width:${pct}%"></b></div><span class="meta">${cnt} · ${pct}%</span>${names.length ? `<div class="who">${names.map(esc).join(', ')}</div>` : ''}` : ''}
      </button>`;
    }).join('') + `</div>`;

  if (revealed) {
    if (mine) html += correct.includes(mine.choice) ? `<div class="note ok">🎉 <b>Bien joué !</b> Tu as trouvé.</div>` : `<div class="note ko"><b>Raté cette fois.</b> Regarde la correction ci-dessous.</div>`;
    if (ex.video_url) html += `<h2>La correction</h2>` + videoEmbed(ex.video_url);

      <a class="btn green" href="${waLink(shareText(ex))}" target="_blank" rel="noopener">Partager sur WhatsApp</a>
      <div class="actions"><a class="btn gold" href="#/exo/${ex.num}/correction">Publier la correction</a></div>`;
  } else if (mine) {
    html += `<div class="note"><b>Réponse enregistrée.</b> Résultat dès que le coach publie la correction. ${total > 1 ? `${total} joueurs ont déjà répondu.` : ''}</div>`;
  } else {
    html += `<p class="sub" style="text-align:center">Touche un coup puis valide. ${total ? `${total} joueur${total > 1 ? 's ont' : ' a'} déjà répondu.` : ''}</p>

  if (del) del.addEventListener('click', () => openSheet(`<h3>Supprimer le challenge ${ex.num} ?</h3><p class="sub">Les réponses des joueurs seront effacées aussi.</p><button class="btn danger" data-a="yes">Oui, supprimer</button><div style="height:8px"></div><button class="btn ghost" data-a="no">Annuler</button>`, async (a, t) => {
    if (a === 'no') return closeSheet();

    try { await S.api.deleteExercise(S.coach, ex.id); await loadAll(); closeSheet(); toast('Exo supprimé'); location.hash = '#/'; }
    catch (e) { closeSheet(); toast(errMsg(e), true); }

function ytId(url) {
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([\w-]{6,})/);
  return m && m[1];
}
function videoEmbed(url) {
  const id = ytId(url);
  if (id) return `<iframe class="yt" src="https://www.youtube.com/embed/${id}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
  return `<video src="${esc(url)}" controls playsinline preload="metadata"></video>`;
}

// ================= Création d'un exo (coach) =================
const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
const ROLES = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };
function draft() {
  return store.get('draft') || { step: 1, placement: START, turn: 'w', options: [], correct: [], question: '', num: null };
}
function saveDraft(d) { store.set('draft', d); }
function castling(placement) {
  const rows = placement.split('/');
  const sq = (file, rank) => { // file 0..7, rank 1..8
    let row = rows[8 - rank], f = 0;
    for (const c of row) { if (/\d/.test(c)) f += +c; else { if (f === file) return c; f++; } if (f > file) break; }
    return null;
  };
  let c = '';
  if (sq(4, 1) === 'K') { if (sq(7, 1) === 'R') c += 'K'; if (sq(0, 1) === 'R') c += 'Q'; }
  if (sq(4, 8) === 'k') { if (sq(7, 8) === 'r') c += 'k'; if (sq(0, 8) === 'r') c += 'q'; }
  return c || '-';
}
const fullFen = (d) => {
  const p = d.pasted && d.pasted.placement === d.placement ? d.pasted : null;
  const c = p && /^(-|K?Q?k?q?)$/.test(p.castle) && p.castle ? p.castle : castling(d.placement);
  const ep = p && /^(-|[a-h][36])$/.test(p.ep) && p.turn === d.turn ? p.ep : '-';
  return `${d.placement} ${d.turn} ${c} ${ep} 0 1`;
};
function checkPosition(d) {
  const p = d.placement;
  const count = (ch) => p.split('').filter(c => c === ch).length;
  if (count('K') !== 1 || count('k') !== 1) return 'Il faut exactement un roi blanc et un roi noir.';
  const rows = p.split('/');
  if (/[pP]/.test(rows[0]) || /[pP]/.test(rows[7])) return 'Un pion ne peut pas être sur la première ou la dernière rangée.';
  let ch;
  try { ch = new Chess(fullFen(d)); } catch (e) { return 'Position impossible : vérifie les pièces et le trait.'; }
  const other = d.turn === 'w' ? 'b' : 'w';
  const kingSq = ch.board().flat().find(x => x && x.type === 'k' && x.color === other)?.square;
  if (kingSq && ch.isAttacked(kingSq, d.turn)) return `Le roi ${other === 'w' ? 'blanc' : 'noir'} est en échec alors que ce n'est pas son tour : vérifie le trait.`;
  if (!ch.moves().length) return 'Aucun coup possible dans cette position (mat ou pat).';
  return null;
}
function parsePasted(txt) {
  let s = txt.trim();
  const m = s.match(/lichess\.org\/(?:editor|analysis)(?:\/standard)?\/([^?#]+)/);
  if (m) s = decodeURIComponent(m[1]).replace(/_/g, ' ');
  const parts = s.split(/\s+/);
  if (!/^([pnbrqkPNBRQK1-8]+\/){7}[pnbrqkPNBRQK1-8]+$/.test(parts[0])) return null;
  return { placement: parts[0], turn: parts[1] === 'b' ? 'b' : 'w', castle: parts[2] || '', ep: parts[3] || '-' };
}

function viewEditor() {
  if (!S.coach) { location.hash = '#/'; return; }
  const d = draft();
  if (d.num == null) d.num = (S.exercises.reduce((m, e) => Math.max(m, e.num), 0) || 0) + 1;
  d.step === 2 ? editorMoves(d) : editorPosition(d);
}
function stepsBar(n) { return `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`; }

function editorPosition(d) {
  const pal = (color) => ['k', 'q', 'r', 'b', 'n', 'p'].map(r => `<button class="pal cg-wrap" data-tool="${color}${r}"><piece class="${ROLES[r]} ${color === 'w' ? 'white' : 'black'}"></piece></button>`).join('');
  $('#app').innerHTML = `${stepsBar(1)}<a class="link" href="#/">← Annuler</a>
    <h1>La position</h1><p class="sub">Touche une pièce ci-dessous puis les cases où la poser. Main ✋ : déplacer (glisse hors de l'échiquier pour retirer).</p>
    <div class="palette">${pal('w')}<button class="pal" data-tool="hand"><span class="ico">✋</span></button>${pal('b')}<button class="pal" data-tool="erase"><span class="ico">🧽</span></button></div>
    <div class="boardbox"><div class="board" id="b"></div></div>
    <div class="row" style="margin-bottom:12px"><button class="btn small" id="start">Départ</button><button class="btn small" id="clear">Vider</button><button class="btn small" id="flip">↻ Tourner</button></div>
    <div class="seg" id="turn"><button data-t="w">Trait aux Blancs</button><button data-t="b">Trait aux Noirs</button></div>
    <details style="margin-top:10px"><summary>Coller une position (lien lichess ou FEN)</summary>
      <label class="field"><input id="paste" placeholder="https://lichess.org/editor/... ou FEN"></label><button class="btn small" id="pasteok">Utiliser</button></details>
    <div class="actions"><button class="btn gold" id="next">Suivant : les coups proposés →</button></div>`;
  let tool = 'hand'; let orientation = store.get('editorOrient') || 'white';
  const el = $('#b');
  const cg = mountBoard(el, {
    fen: d.placement, orientation, coordinates: true, autoCastle: false,
    movable: { free: true, color: 'both', showDests: false }, premovable: { enabled: false },
    draggable: { enabled: true, deleteOnDropOff: true }, highlight: { lastMove: false, check: false },
    animation: { enabled: true, duration: 120 },
    events: { change: () => { d.placement = cg.getFen(); saveDraft(d); } },
  });
  const setTool = (t) => {
    tool = t;
    $$('.palette .pal').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    const hand = t === 'hand';
    cg.set({ movable: { free: hand, color: hand ? 'both' : undefined }, draggable: { enabled: hand }, selectable: { enabled: hand } });
    cg.selectSquare(null);
  };
  setTool('hand');
  $$('.palette .pal').forEach(b => b.addEventListener('click', () => setTool(tool === b.dataset.tool ? 'hand' : b.dataset.tool)));
  el.addEventListener('pointerdown', (e) => {
    if (tool === 'hand') return;
    const key = cg.getKeyAtDomPos([e.clientX, e.clientY]); if (!key) return;
    e.preventDefault(); e.stopPropagation();
    const cur = cg.state.pieces.get(key);
    if (tool === 'erase') { cg.setPieces(new Map([[key, undefined]])); }
    else {
      const color = tool[0] === 'w' ? 'white' : 'black'; const role = ROLES[tool[1]];
      const same = cur && cur.color === color && cur.role === role;
      cg.setPieces(new Map([[key, same ? undefined : { color, role }]]));
    }
    d.placement = cg.getFen(); saveDraft(d);
  }, true);
  const turnBtns = () => $$('#turn button').forEach(b => b.classList.toggle('on', b.dataset.t === d.turn));
  turnBtns();
  $$('#turn button').forEach(b => b.addEventListener('click', () => {
    d.turn = b.dataset.t; saveDraft(d); turnBtns();
    orientation = d.turn === 'w' ? 'white' : 'black'; store.set('editorOrient', orientation); cg.set({ orientation });
  }));
  $('#start').onclick = () => { cg.set({ fen: START }); d.placement = START; saveDraft(d); };
  $('#clear').onclick = () => { cg.set({ fen: '8/8/8/8/8/8/8/8' }); d.placement = cg.getFen(); saveDraft(d); };
  $('#flip').onclick = () => { cg.toggleOrientation(); orientation = cg.state.orientation; store.set('editorOrient', orientation); };
  $('#pasteok').onclick = () => {
    const r = parsePasted($('#paste').value);
    if (!r) return toast('Je ne reconnais pas cette position.', true);
    d.placement = r.placement; d.turn = r.turn; d.pasted = r.castle ? { placement: r.placement, turn: r.turn, castle: r.castle, ep: r.ep } : null; saveDraft(d);
    orientation = d.turn === 'w' ? 'white' : 'black'; store.set('editorOrient', orientation);
    cg.set({ fen: d.placement, orientation }); turnBtns(); toast('Position chargée');
  };
  $('#next').onclick = () => {
    d.placement = cg.getFen();
    const err = checkPosition(d); if (err) return toast(err, true);
    if (d.fenUsed && d.fenUsed !== fullFen(d)) { d.options = []; d.correct = []; }
    d.fenUsed = fullFen(d);
    if (!d.question) d.question = `Que jouent les ${d.turn === 'w' ? 'Blancs' : 'Noirs'} ?`;
    if (/^Que jouent les (Blancs|Noirs) \?$/.test(d.question)) d.question = `Que jouent les ${d.turn === 'w' ? 'Blancs' : 'Noirs'} ?`;
    d.step = 2; saveDraft(d); clearBoards(); viewEditor(); window.scrollTo(0, 0);
  };
}

function editorMoves(d) {
  const fen = fullFen(d);
  const chess = new Chess(fen);
  const color = d.turn === 'w' ? 'white' : 'black';
  const dests = () => { const m = new Map(); for (const mv of chess.moves({ verbose: true })) { if (!m.has(mv.from)) m.set(mv.from, []); m.get(mv.from).push(mv.to); } return m; };
  $('#app').innerHTML = `${stepsBar(2)}<a class="link" id="back" href="javascript:void 0">← Modifier la position</a>
    <h1>Les coups proposés</h1><p class="sub">Joue sur l'échiquier chaque coup à proposer. Touche ★ sur le bon (plusieurs possibles).</p>
    <div class="boardbox"><div class="board" id="b"></div></div>
    <div class="olist" id="olist"></div>
    <label class="field"><span>Question</span><input id="question" maxlength="120"></label>
    <label class="field"><span>Numéro du challenge</span><input id="num" type="number" inputmode="numeric" min="1"></label>
    <div class="actions"><button class="btn gold" id="pub">Publier l'exo</button></div>`;
  $('#question').value = d.question; $('#num').value = d.num;
  $('#question').oninput = (e) => { d.question = e.target.value; saveDraft(d); };
  $('#num').oninput = (e) => { d.num = parseInt(e.target.value, 10) || null; saveDraft(d); };
  const cg = mountBoard($('#b'), {
    fen: d.placement, orientation: color, turnColor: color, coordinates: true,
    movable: { free: false, color, dests: dests(), showDests: true, events: { after: (orig, dest) => onMove(orig, dest) } },
    premovable: { enabled: false }, highlight: { lastMove: true, check: true }, draggable: { enabled: true },
  });
  const reset = () => setTimeout(() => cg.set({ fen: d.placement, turnColor: color, lastMove: undefined, movable: { color, dests: dests() } }), 450);
  const add = (from, to, promotion) => {
    const mv = chess.move({ from, to, promotion }); chess.undo();
    if (!mv) return reset();
    const uci = from + to + (promotion || '');
    if (d.options.some(o => o.uci === uci)) { toast('Ce coup est déjà proposé'); return reset(); }
    if (d.options.length >= 8) { toast('8 coups maximum', true); return reset(); }
    d.options.push({ san: mv.san, uci }); saveDraft(d); renderList(); reset();
  };
  const onMove = (orig, dest) => {
    const p = chess.get(orig);
    if (p && p.type === 'p' && (dest[1] === '8' || dest[1] === '1')) {
      openSheet(`<h3>Promotion</h3><div class="promo">${['q', 'r', 'b', 'n'].map(r => `<button class="pal cg-wrap" data-a="${r}"><piece class="${ROLES[r]} ${color}"></piece></button>`).join('')}</div><button class="btn ghost" data-a="x">Annuler</button>`, (a) => {
        closeSheet(); if (a === 'x' || a === '__close') return reset(); if (['q', 'r', 'b', 'n'].includes(a)) add(orig, dest, a);
      });
    } else add(orig, dest);
  };
  const renderList = () => {
    const L = $('#olist');
    L.innerHTML = d.options.length ? d.options.map((o, i) => `<div class="oitem ${d.correct.includes(i) ? 'ok' : ''}"><span class="san">${esc(moveLabel(fen, o.san))}</span><button class="star" data-i="${i}" aria-label="Bon coup">★</button><button class="rm" data-i="${i}" aria-label="Retirer">✕</button></div>`).join('')
      : `<div class="empty">Aucun coup pour l'instant. Joue-les sur l'échiquier.</div>`;
    $$('.star', L).forEach(b => b.onclick = () => { const i = +b.dataset.i; d.correct = d.correct.includes(i) ? d.correct.filter(x => x !== i) : [...d.correct, i]; saveDraft(d); renderList(); });
    $$('.rm', L).forEach(b => b.onclick = () => { const i = +b.dataset.i; d.options.splice(i, 1); d.correct = d.correct.filter(x => x !== i).map(x => x > i ? x - 1 : x); saveDraft(d); renderList(); });
    const pub = $('#pub');
    const ready = d.options.length >= 2 && d.correct.length >= 1;
    pub.disabled = !ready;
    pub.textContent = d.options.length < 2 ? `Propose au moins 2 coups` : (!d.correct.length ? 'Touche ★ sur le bon coup' : `Publier l'exo`);
    cg.setAutoShapes(d.options.map((o, i) => uciShape(o.uci, d.correct.includes(i) ? 'green' : 'paleBlue')));
  };
  renderList();
  $('#back').onclick = () => { d.step = 1; saveDraft(d); clearBoards(); viewEditor(); };
  $('#pub').onclick = async () => {
    const b = $('#pub');
    if (!d.num || d.num < 1) return toast('Indique un numéro de challenge.', true);
    if (S.exercises.some(e => e.num === d.num)) return toast(`Le challenge ${d.num} existe déjà : change le numéro.`, true);
    b.disabled = true; b.innerHTML = '<span class="spin"></span> Publication…';
    try {
      await S.api.createExercise(S.coach, { num: d.num, fen, question: (d.question || '').trim() || `Que jouent les ${d.turn === 'w' ? 'Blancs' : 'Noirs'} ?`, options: d.options, correct: d.correct });
      const num = d.num; store.set('draft', null); await loadAll(); shareScreen(num);
    } catch (e) { toast(errMsg(e), true); b.disabled = false; b.textContent = "Publier l'exo"; }
  };
}

// ================= Correction (coach) =================
let camStream = null, recorder = null, recTimer = null;
function stopCamera() {
  try { if (recorder) { recorder.onstop = null; recorder.ondataavailable = null; if (recorder.state !== 'inactive') recorder.stop(); } } catch {}
  recorder = null; clearInterval(recTimer);
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}
function pickMime() {
  if (!window.MediaRecorder) return null;
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || '';
}
const mb = (n) => (n / 1024 / 1024).toFixed(1).replace('.', ',') + ' Mo';

async function viewReveal(num) {
  if (!S.coach) { location.hash = `#/exo/${num}`; return; }
  const ex = exoByNum(num); if (!ex) { location.hash = '#/'; return; }
  const correct = await loadSolution(ex);

  const total = answersOf(ex.id).length;
  const found = answersOf(ex.id).filter(a => correct.includes(a.choice)).length;
  let video = null;           // { blob } ou { url }
  let facing = 'environment';

  $('#app').innerHTML = `<a class="link" href="#/exo/${num}">← Challenge ${num}</a>
    <h1>Correction du challenge ${num}</h1>
    <div class="note gold">Bonne réponse : <b>${esc(good)}</b> · trouvée par <b>${found}</b> joueur${found > 1 ? 's' : ''} sur ${total}.</div>
    <h2>Ta vidéo</h2>
    <div id="vzone"></div>
    <label class="field"><span>Un mot pour le club (facultatif)</span><textarea id="comment" rows="3" placeholder="Ex. Le coup g4 lance l'attaque avant que les Noirs ne jouent …f5."></textarea></label>
    <div class="actions"><button class="btn gold" id="pub">Publier la correction</button></div>`;
  $('#comment').value = ex.comment || '';

  const zone = $('#vzone');
  const choose = () => {
    stopCamera();
    zone.innerHTML = `
      ${ex.video_url && !video ? `<div class="note">Vidéo actuelle :</div>${videoEmbed(ex.video_url)}<div style="height:10px"></div>` : ''}
      <button class="btn" id="rec">🎥 Filmer ma correction</button><div style="height:8px"></div>
      <label class="btn ghost" style="cursor:pointer">📁 Choisir une vidéo du téléphone<input id="file" type="file" accept="video/*" class="hidden"></label>
      <details><summary>Ou coller un lien YouTube</summary><label class="field"><input id="yt" placeholder="https://youtu.be/..."></label><button class="btn small" id="ytok">Utiliser ce lien</button></details>`;
    $('#rec').onclick = recordUI;
    $('#file').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > MAX_VIDEO) { toast(`Vidéo trop lourde (${mb(f.size)}, maximum 50 Mo). Filme-la plutôt ici, c'est compressé automatiquement.`, true); e.target.value = ''; return; }
      video = { blob: f }; preview();
    };
    $('#ytok').onclick = () => { const u = $('#yt').value.trim(); if (!ytId(u)) return toast('Lien YouTube non reconnu', true); video = { url: u }; preview(); };
  };
  const preview = () => {
    stopCamera();
    const src = video.blob ? URL.createObjectURL(video.blob) : null;
    zone.innerHTML = (src ? `<video src="${src}" controls playsinline></video><p class="sub" style="margin-top:6px">${mb(video.blob.size)}</p>` : videoEmbed(video.url))
      + `<button class="btn ghost" id="redo">Changer de vidéo</button>`;
    $('#redo').onclick = () => { video = null; choose(); };
  };
  const recordUI = async () => {
    const mime = pickMime();
    if (mime === null || !navigator.mediaDevices?.getUserMedia) { toast("Ce téléphone ne permet pas de filmer ici : choisis une vidéo à la place.", true); return; }
    zone.innerHTML = `<div class="rec"><video id="live" playsinline muted autoplay></video><div class="live hidden" id="lv"><i></i><span id="tm">0:00</span></div></div>
      <div class="row" style="align-items:center;margin-top:14px"><button class="btn small ghost" id="cancel">Annuler</button><button class="recbtn" id="rb" aria-label="Enregistrer"><b></b></button><button class="btn small ghost" id="sw">↻ Caméra</button></div>
      <p class="sub" style="text-align:center;margin-top:8px">5 minutes maximum. Le son est enregistré.</p>`;
    const start = async () => {
      if (camStream) camStream.getTracks().forEach(t => t.stop());
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true });
      } catch (e) { toast("Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.", true); choose(); return; }
      const v = $('#live'); if (v) { v.srcObject = camStream; v.play().catch(() => {}); }
    };
    await start();
    $('#sw').onclick = async () => { if (recorder) return; facing = facing === 'environment' ? 'user' : 'environment'; await start(); };
    $('#cancel').onclick = () => choose();
    $('#rb').onclick = () => {
      const rb = $('#rb');
      if (!recorder) {
        if (!camStream) return;
        const chunks = []; let bytes = 0;
        const opts = { videoBitsPerSecond: 1_000_000, audioBitsPerSecond: 64_000 }; if (mime) opts.mimeType = mime;
        try { recorder = new MediaRecorder(camStream, opts); } catch { recorder = new MediaRecorder(camStream); }
        recorder.ondataavailable = (e) => {
          if (!e.data || !e.data.size) return;
          chunks.push(e.data); bytes += e.data.size;
          if (bytes > MAX_VIDEO * 0.9 && recorder && recorder.state === 'recording') { toast('Taille maximale atteinte : enregistrement arrêté.'); recorder.stop(); }
        };
        recorder.onstop = () => {
          const type = (recorder && recorder.mimeType) || mime || 'video/mp4';
          const blob = new Blob(chunks, { type: type.split(';')[0] });
          recorder = null; clearInterval(recTimer);
          if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
          if (!blob.size) { toast("L'enregistrement a échoué, réessaie.", true); return choose(); }
          if (blob.size > MAX_VIDEO) { toast(`Vidéo trop lourde (${mb(blob.size)}). Fais plus court.`, true); return choose(); }
          video = { blob }; preview();
        };
        recorder.start(1000);
        const t0 = Date.now(); $('#lv').classList.remove('hidden'); rb.classList.add('on'); $('#sw').disabled = true;
        recTimer = setInterval(() => {
          const s = Math.floor((Date.now() - t0) / 1000); const tm = $('#tm'); if (tm) tm.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
          if (s >= MAX_REC_SECONDS && recorder) recorder.stop();
        }, 500);
      } else { recorder.stop(); }
    };
  };
  choose();

  $('#pub').onclick = async () => {
    const b = $('#pub'); b.disabled = true;
    try {
      let url = ex.video_url || null;
      if (video && video.blob) {

        const type = (video.blob.type || 'video/mp4').split(';')[0];
        const ext = type.includes('webm') ? 'webm' : type.includes('quicktime') ? 'mov' : 'mp4';
        url = await S.api.uploadVideo(video.blob, `challenge-${num}-${Date.now()}.${ext}`);
      } else if (video && video.url) url = video.url;
      b.innerHTML = '<span class="spin"></span> Publication…';
      await S.api.reveal(S.coach, ex.id, url, $('#comment').value);
      await loadAll(); stopCamera();
      $('#app').innerHTML = `<h1>Correction publiée 🎉</h1><p class="sub">Les joueurs voient maintenant la réponse, ta vidéo et le classement.</p>
        <a class="btn green" href="${waLink(`✅ Correction du Challenge Caïssa ${num} en ligne${url ? ', avec la vidéo du coach' : ''}.\n👉 ${exoLink(num)}`)}" target="_blank" rel="noopener">Annoncer sur WhatsApp</a>
        <div style="height:10px"></div><a class="btn" href="#/exo/${num}">Voir l'exo</a><div style="height:10px"></div><a class="btn ghost" href="#/classement">Voir le classement</a>`;
    } catch (e) { toast(errMsg(e), true); b.disabled = false; b.textContent = 'Publier la correction'; }
  };
}

// ================= Joueurs (coach) =================
function viewMembers() {
  if (!S.coach) { location.hash = '#/'; return; }
  const list = [...S.members].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  $('#app').innerHTML = `<a class="link" href="#/">← Exos</a><h1>Joueurs</h1><p class="sub">Chacun s'ajoute tout seul. Ici tu peux retirer un doublon ou un faux nom.</p>
    <ul class="lb">${list.map(m => `<li><span class="nm">${esc(m.name)}</span><span class="meta" style="color:var(--muted);font-size:13px">${S.answers.filter(a => a.member_id === m.id).length} rép.</span><button class="btn small danger" data-id="${m.id}">Retirer</button></li>`).join('') || '<div class="empty">Personne pour l’instant.</div>'}</ul>`;
  $$('[data-id]').forEach(b => b.onclick = () => openSheet(`<h3>Retirer ${esc(memberName(b.dataset.id))} ?</h3><p class="sub">Ses réponses seront effacées.</p><button class="btn danger" data-a="yes">Retirer</button><div style="height:8px"></div><button class="btn ghost" data-a="no">Annuler</button>`, async (a) => {
    if (a === 'no') return closeSheet();
    try { await S.api.deleteMember(S.coach, b.dataset.id); await loadAll(); closeSheet(); viewMembers(); toast('Joueur retiré'); }
    catch (e) { closeSheet(); toast(errMsg(e), true); }
  }));
}

// ================= Démarrage =================
(async () => {
  try {
    S.api = await makeApi();
    await loadAll();
    if (S.coach) { try { if (!(await S.api.coachOk(S.coach))) { S.coach = null; store.set('coach', null); } } catch {} }
  } catch (e) {
    $('#app').innerHTML = `<h1>Connexion impossible</h1><p class="sub">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Réessayer</button>`;
    return;
  }
  renderWho();
  route();
})();
</script>
</body>
</html>
